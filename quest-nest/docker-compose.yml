services:
  postgres:
    image: postgres:16-alpine
    container_name: quest-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quest_nest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quest_nest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

